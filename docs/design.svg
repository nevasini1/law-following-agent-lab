<svg xmlns="http://www.w3.org/2000/svg" width="980" height="372" viewBox="0 0 980 372" role="img" aria-label="Court opinions are segmented and span-verified into environment specs that seed a scenario generator. Agents act in the environment through a firewall. Every action is labeled by one legal oracle built from quote-verified primary law, and its findings feed eval metrics, judge gold labels, the RL reward and probe labels." style="color: var(--ink)">
