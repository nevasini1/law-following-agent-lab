      <rect x="20" y="146" width="150" height="58" rx="7"/><rect x="226" y="146" width="170" height="58" rx="7"/>
      <rect x="452" y="146" width="508" height="58" rx="7"/>
      <rect x="20" y="276" width="150" height="58" rx="7"/>
      <rect x="452" y="276" width="118" height="58" rx="7"/><rect x="582" y="276" width="118" height="58" rx="7"/>
      <rect x="712" y="276" width="118" height="58" rx="7"/><rect x="842" y="276" width="118" height="58" rx="7"/>
    </g>
    <rect x="226" y="276" width="170" height="58" rx="7" fill="none" stroke-width="2" style="stroke: var(--accent)"/>
    <g text-anchor="middle">
      <text x="95" y="44" font-weight="600">Court opinion</text><text x="95" y="61" font-size="11" fill-opacity="0.7">Caselaw Access Project</text>
      <text x="311" y="44" font-weight="600">Segment + verify</text><text x="311" y="61" font-size="11" fill-opacity="0.7">court-label classifier, spans</text>
      <text x="542" y="44" font-weight="600">EnvSpec</text><text x="542" y="61" font-size="11" fill-opacity="0.7">facts, rules, holdings</text>
      <text x="824" y="44" font-weight="600">Scenario generator</text><text x="824" y="61" font-size="11" fill-opacity="0.7">boundary sweeps, a fortiori ladders</text>
      <text x="95" y="171" font-weight="600">Agent</text><text x="95" y="188" font-size="11" fill-opacity="0.7">open-weight LLMs</text>
      <text x="311" y="171" font-weight="600">Firewall</text><text x="311" y="188" font-size="11" fill-opacity="0.7">rules · monitor · audit</text>
      <text x="706" y="171" font-weight="600">Environment</text><text x="706" y="188" font-size="11" fill-opacity="0.7">system of record, simulated consumer, coworker, manager</text>
      <text x="95" y="301" font-weight="600">Primary law</text><text x="95" y="318" font-size="11" fill-opacity="0.7">16 sources, sha256</text>
      <text x="311" y="301" font-weight="600" style="fill: var(--accent)">Legal oracle</text><text x="311" y="318" font-size="11" fill-opacity="0.7">32 provisions, certainty</text>
